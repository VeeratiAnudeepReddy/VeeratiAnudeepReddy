name: Update Profile Heatmap

on:
  schedule:
    - cron: "0 0 * * *"   # Daily at midnight UTC
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write          # Needed to commit the updated SVG back to the repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data (authenticated — includes private)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_contributions.py --output data/contributions.json

      - name: Regenerate heatmap SVG
        run: python3 scripts/render_heatmap_svg.py --input data/contributions.json --output contrib-heatmap.svg

      - name: Commit and push updated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution heatmap [skip ci]"
          git push
